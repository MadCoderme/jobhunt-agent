# Copy this to config.yaml and edit for your profile.

resume_path: "resume.txt"          # plain text file with your resume content
output_html: "jobs_shortlist.html" # regenerated every run
db_path: "jobs_seen.sqlite3"       # tracks jobs already scored so you don't re-score them

# --- Cheap keyword pre-filter (runs BEFORE any LLM call, saves your free quota) ---
preferences:
  # Titles containing any of these (case-insensitive) are dropped immediately.
  exclude_seniority:
    - "senior"
    - "sr."
    - "staff"
    - "principal"
    - "lead "
    - "director"
    - "head of"
    - " vp "
    - "chief"
    - "manager"

  # A job must contain at least one of these in title+description to survive.
  # Leave empty to disable this filter.
  include_keywords:
    - "python"
    - "backend"
    - "software engineer"
    - "data engineer"
    - "machine learning"
    - "ai engineer"
    - "ml engineer"

  # Job is dropped if it contains any of these anywhere.
  exclude_keywords:
    - "unpaid"
    - "volunteer"
    - "commission only"

  preferences: |
    AI/ML Engineer Role with optionally full stack work
    MUST take applicants from outside the US, from Bangladesh. If the role only hires from US/UK/India, then it is not a match.
  remote_only: true
  min_salary_usd: 0   # set >0 to require a stated salary floor (many postings omit salary, so keep 0 unless you want to lose those)

# --- LLM scoring ---
scoring:
  score_threshold: 65      # only jobs scoring >= this show up in the final HTML
  max_jobs_per_run: 40     # hard cap on LLM calls per run, protects free-tier quota
  gemini_model: "gemini-3.5-flash-lite"
  groq_model: "llama-3.3-70b-versatile"

# --- Free API sources (no key needed unless noted) ---
sources:
  arbeitnow: true
  remoteok: true
  remotive: true
  jobicy: true
  adzuna: false            # needs ADZUNA_APP_ID / ADZUNA_APP_KEY in .env

# --- Browser-tab capture (reads tabs YOU already have open & logged into) ---
# Requires launching Chrome separately with remote debugging enabled - see README.
browser_capture:
  enabled: true
  cdp_url: "http://localhost:9222"
  # Only tabs whose URL contains one of these substrings will be read.
  site_url_patterns:
    - "wellfound.com"
    - "indeed.com"
    - "jobright.ai"
  scroll_passes: 6          # how many times to scroll each tab to load more results (Wellfound/Jobright)
  scroll_pause_seconds: 1.2
  indeed_max_pages: 3       # Indeed paginates with a "Next" button instead of scrolling; how many pages to click through
  visit_detail_pages: true  # visit each job's own page to read the FULL description, not just the card snippet
  max_detail_pages_per_run: 30   # hard cap on total detail-page visits per run, across all 3 sites combined
  detail_page_delay_seconds: 1.5 # pause between detail-page visits (kept human-paced on purpose)